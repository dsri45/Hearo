<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Hearo Watch Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b12;
      color: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 38%, #17233a 0, #0b101a 43%, #080b12 78%);
    }
    main { width: min(100%, 390px); text-align: center; }
    .brand { margin: 0 0 26px; color: #aebbd0; font-size: 13px; font-weight: 650; letter-spacing: .18em; text-transform: uppercase; }
    .watch {
      width: 276px;
      height: 336px;
      margin: auto;
      padding: 18px;
      display: grid;
      place-items: center;
      border: 9px solid #303741;
      border-radius: 76px;
      background: linear-gradient(145deg, #252b34, #11151c 68%);
      box-shadow: 0 32px 80px #0009, inset 0 0 0 2px #5b626c;
      position: relative;
    }
    .watch::after {
      content: "";
      position: absolute;
      right: -15px;
      top: 94px;
      width: 7px;
      height: 54px;
      border-radius: 0 5px 5px 0;
      background: #737b86;
    }
    .screen {
      width: 100%;
      height: 100%;
      padding: 38px 20px 24px;
      border-radius: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1a2c48, #090d15 65%);
      box-shadow: inset 0 0 24px #0008;
    }
    .time { color: #91a0b7; font-size: 14px; font-variant-numeric: tabular-nums; }
    .icon {
      width: 46px;
      height: 46px;
      margin: 28px 0 17px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #d8e8ff;
      background: #4b8df033;
      border: 1px solid #78adff55;
      font-size: 22px;
    }
    .eyebrow { margin: 0 0 8px; color: #87b5ff; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0; max-width: 170px; font-size: 22px; line-height: 1.16; font-weight: 700; overflow-wrap: anywhere; }
    .caption { margin: 14px 0 0; color: #8f9bb0; font-size: 12px; }
    .samples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 27px 0 0; }
    button {
      border: 1px solid #29364a;
      border-radius: 999px;
      padding: 9px 13px;
      background: #111a28;
      color: #dce8fb;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: #76a9f5; outline: none; }
    .note { margin: 18px 0 0; color: #7d899d; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Hearo · Watch preview</p>
    <div class="watch" aria-label="Apple Watch screen preview">
      <section class="screen">
        <time class="time" id="time">9:41</time>
        <div class="icon" aria-hidden="true">◉</div>
        <p class="eyebrow">LATEST ALERT</p>
        <h1 id="alert-title">Name detected</h1>
        <p class="caption">Hearo alert</p>
      </section>
    </div>
    <div class="samples" aria-label="Preview alert titles">
      <button type="button" data-title="Name detected">Name detected</button>
      <button type="button" data-title="Flight change">Flight change</button>
      <button type="button" data-title="Doorbell">Doorbell</button>
    </div>
    <p class="note">This is a visual browser preview. Haptics run in the native Watch app through Xcode’s Watch simulator or on Apple Watch.</p>
  </main>
  <script>
    const title = document.getElementById("alert-title");
    document.querySelectorAll("[data-title]").forEach((button) => {
      button.addEventListener("click", () => { title.textContent = button.dataset.title; });
    });
  </script>
</body>
</html>
